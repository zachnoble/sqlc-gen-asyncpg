version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - intrange
    - misspell
    - nolintlint
    - perfsprint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - hugeParam
        - unnamedResult
        - paramTypeCombine
        - whyNoLint

formatters:
  enable:
    - gofmt
    - goimports

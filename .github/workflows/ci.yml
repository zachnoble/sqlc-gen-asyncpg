name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  SQLC_VERSION: "1.31.1"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  E2E_DSN: postgresql://postgres:postgres@localhost:55439/postgres

jobs:
  go:
    name: Go (tidy, vet, lint, vuln, modernize, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: modernize
        run: |
          go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -test ./...
          go fix -diff ./...

      - name: build (native)
        run: go build -o bin/sqlc-gen-asyncpg .

      - name: build (wasm)
        run: |
          GOOS=wasip1 GOARCH=wasm go build -trimpath -o bin/sqlc-gen-asyncpg.wasm .
          sha256sum bin/sqlc-gen-asyncpg.wasm | tee bin/sqlc-gen-asyncpg.wasm.sha256

      - name: go test
        run: go test -race ./...

      - uses: actions/upload-artifact@v7
        with:
          name: sqlc-gen-asyncpg-wasm
          path: |
            bin/sqlc-gen-asyncpg.wasm
            bin/sqlc-gen-asyncpg.wasm.sha256

  e2e:
    name: E2E (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: astral-sh/setup-uv@v10

      - name: Install sqlc
        run: |
          curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin sqlc
          sqlc version

      - name: e2e
        working-directory: e2e
        run: python3 run.py --pythons ${{ matrix.python }}

      - name: generated code is up to date
        run: |
          git add -N e2e/cases
          git diff --exit-code --stat -- e2e/cases || {
            echo "::error::generated code differs from the committed snapshot; run 'just e2e' and commit"
            exit 1
          }

  corpus:
    name: sqlc corpus (generate, ty, pyrefly, PREPARE)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: astral-sh/setup-uv@v10

      - name: Install sqlc
        run: |
          curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin sqlc
          sqlc version

      - name: Fetch sqlc test corpus
        run: git clone --depth 1 --branch "v${SQLC_VERSION}" https://github.com/sqlc-dev/sqlc.git "$RUNNER_TEMP/sqlc-src"

      - name: corpus
        working-directory: e2e
        run: python3 corpus.py --sqlc-src "$RUNNER_TEMP/sqlc-src"
